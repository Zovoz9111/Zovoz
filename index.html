<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zovoz - Kitchen & Dining</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f7f7f7;
}

header {
    background: white;
    padding: 30px;
    text-align: center;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

.product {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.product img {
    width: 100%;
    border-radius: 10px;
}

.button {
    display: inline-block;
    background: black;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
}
</style>

</head>

<body>

<header>
<h1>Kitchen & Dining Products</h1>
<p>Smart products for your everyday kitchen</p>
</header>


<div class="products" id="product-list"></div>


<script src="products.js"></script>

<script>

const container = document.getElementById("product-list");

products.forEach(product => {

container.innerHTML += `

<div class="product">

<img src="${product.image}">

<h2>${product.title}</h2>

<p>${product.price}</p>

<a class="button" href="${product.link}" target="_blank">
View on Amazon
</a>

</div>

`;

});

</script>


</body>
</html>
