<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zovoz - Home Products</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f7f7f7;
    color: #222;
}

header {
    background: white;
    padding: 25px;
    text-align: center;
}

h1 {
    margin: 0;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

.product {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.product img {
    width: 100%;
    border-radius: 10px;
}

button {
    background: #000;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}
</style>

</head>

<body>

<header>
<h1>Home Products</h1>
<p>Smart products for everyday life</p>
</header>


<div class="products">

<div class="product">
<img src="https://via.placeholder.com/300">

<h2>Kitchen Organizer</h2>

<p>A useful product to keep your home organized.</p>

<button>View Product</button>

</div>


<div class="product">
<img src="https://via.placeholder.com/300">

<h2>Smart Home Product</h2>

<p>Discover practical products for your home.</p>

<button>View Product</button>

</div>


</div>

</body>
</html>
